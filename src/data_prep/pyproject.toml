[project]
name = "data-prep-pipeline"
version = "0.1.0"
description = "Data preparation pipeline for GrainSegmentation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grainsegmentation-common",
    "gdown==5.2.1",
    "sam-2",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "opencv-python==4.13.0.92",
    "large-image==1.34.0",
    "large-image-source-tiff==1.34.0",
    "large-image-source-tifffile==1.34.0",
    "tqdm==4.67.3",
    "geopandas==1.1.3",
    "pygeoops==0.6.0",
    "rasterio==1.5.0",
    "shapelysmooth==0.2.1",
]

[tool.uv.sources]
grainsegmentation-common = { path = "../common", editable = true }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_prep"]

[tool.setuptools.package-dir]
data_prep = "."
