[project]
name = "grainsegmentation-common"
version = "0.1.0"
description = "Shared utilities for GrainSegmentation pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas==1.1.3",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "pillow==12.2.0",
    "pycocotools==2.0.11",
    "shapely==2.1.2",
    "tifffile==2026.3.3",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-dir]
common = "."
