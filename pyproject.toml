[project]
name = "grainsegmentation-workspace"
version = "0.0.0"
description = "Workspace tooling for GrainSegmentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.15.13",
    "pytest==9.0.3",
    "pyyaml>=6.0.3",
    "grainsegmentation-common",
    "unet-pipeline",
    "yolo",
]

[tool.uv.sources]
grainsegmentation-common = { path = "src/common", editable = true }
unet-pipeline = { path = "src/unet", editable = true }
yolo = { path = "src/yolo", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "src/common/tests", "src/unet/tests", "src/yolo/tests"]
pythonpath = ["src/common", "src/unet", "src/yolo"]
markers = [
    "integration: copies manifest assets on disk (staging contract)",
]

[tool.ruff]
target-version = "py312"
