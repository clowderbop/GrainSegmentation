# Full factorial YOLO inference profile search on train whole section (ADR 0005).
# Cartesian product of five knobs; match_metric includes IOS and IOU (exploratory).
# Current axis lists: 2×2×3×3×3 = 216 candidates.

grid:
  postprocess_type:
    - GREEDYNMM
    - NMM
  match_metric:
    - IOS
    - IOU
  match_threshold:
    - 0.4
    - 0.5
    - 0.6
  conf:
    - 0.15
    - 0.25
    - 0.35
  mask_threshold:
    - 0.4
    - 0.5
    - 0.6
