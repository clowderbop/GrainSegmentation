# U-Net watershed hyperparameter grid for train whole-section tuning.
# Override at submit time via GRID_CONFIG / --grid-config.
#
# Coarse grid: 216 combos/variant; h_maxima dominated
# (~0.20–0.26 PQ spread); optimum at h=24 (grid ceiling, still rising). Secondary
# axes negligible at high h: min_distance spread ~0.002; boundary_dilate_iter,
# watershed_connectivity ~0.000; min_area_px inert at h≥24.
#
# Refinement: fix secondary parameters at coarse consensus; extend h_maxima above 24
# until PQ plateaus. Merge refinement CSVs with coarse results before final selection.
grid:
  # Fixed: monotonic preference for larger separation;
  # md=17 best in 3/4 variants. PPL+PPXBlend best=14 due to tiebreak, metrics basically identical
  min_distance: [17]

  # Fixed: pooled spread ~0.000 in coarse tuning. PPLPPXblend best=1 due to tiebreak
  # Original: [0, 1]

  boundary_dilate_iter: [0]

  # Refinement axis — extend above coarse ceiling (h=24).
  # Original: [0, 2, 4, 8, 12, 16, 24]
  h_maxima: [28, 32, 40, 48, 64]

  # Fixed: 8-connected; pooled spread ~0.000 in coarse tuning. PPL best=1 but difference was 0.0001 PQ
  # Original: [1, 2]
  watershed_connectivity: [2]

  # Fixed: identical instance maps for 256/512/1024 at h=24 in coarse tuning.
  # Original: [256, 512, 1024]
  min_area_px: [256]

  # Fixed: best in every variant in coarse tuning.
  # Original: [0, 1]
  exclude_border: [1]

  ridge_level:
    - null
